substitutions:
  device_name: "smartplug-01"

esphome:
  name: "${device_name}"
  friendly_name: "${device_name}"

esp8266:
  board: esp01_1m

logger:

ota:
  platform: esphome

api:

wifi:
  networks:
    - ssid: "STUDIO_WIFI_SSID"
      password: "STUDIO_WIFI_PASSWORD"
      priority: 2.0
    - ssid: "HOME_WIFI_SSID"
      password: "HOME_WIFI_PASSWORD"
      priority: 1.0
  ap:
    ssid: "${device_name}-Fallback"
    password: "fallbackpassword"

  use_address: "${device_name}"

# The physical relay
switch:
  - platform: gpio
    pin: GPIO12
    id: relay_switch
    name: "Relay"

# The physical push button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Power Button"
    on_press:
      - switch.toggle: relay_switch