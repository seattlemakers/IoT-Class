substitutions:
  # Node Identity
  device_name: "smartplug-01"

  # Network Credentials
  wifi_ssid_studio: "SM-Electronics-1"
  wifi_password_studio: "SM-Electronics-1"
  wifi_ssid_home: "HOME_WIFI_SSID"
  wifi_password_home: "HOME_WIFI_PASSWORD"
  fallback_password: "${device_name}-Fallback"

esphome:
  name: "${device_name}"
  friendly_name: "${device_name}"

esp8266:
  board: esp01_1m

logger:

ota:
  - platform: esphome

api:

wifi:
  networks:
    - ssid: "${wifi_ssid_studio}"
      password: "${wifi_password_studio}"
      priority: 2.0
    - ssid: "${wifi_ssid_home}"
      password: "${wifi_password_home}"
      priority: 1.0
  ap:
    ssid: "${device_name}-Fallback"
    password: "${fallback_password}"

# The physical relay
switch:
  - platform: gpio
    pin: GPIO12
    id: relay_switch
    name: "Relay"

# The physical push button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Power Button"
    on_press:
      - switch.toggle: relay_switch